 <!DOCTYPE html>
 <html lang="en">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>5 A DAY {{ date }}</title>
     <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
     <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.10.1/lottie.min.js"></script>
     <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
 </head>
 <body>
     <div id="content" style="display: none;">
         <svg id="symbol-container"></svg>
         <div id="lottie-background-left" class="lottie-background"></div>
         <div id="lottie-background-right" class="lottie-background"></div>
         <div class="container">
             <header class="header">
                 <img src="{{ url_for('static', filename='title.png') }}" alt="Corbett Maths Worksheets" class="title-image">
                 <img src="{{ url_for('static', filename='lights.png') }}" alt="Lights Overlay" class="lights-overlay" style="width: 100%; height: auto; opacity: 0.9;">
                 <p class="date">For today's date: {{ date }}</p>
             </header>
             <div class="card gcse">
                 <h2>GCSE Worksheets</h2>
                 <ul id="gcse-worksheets">
                     <li>Loading...</li>
                 </ul>
             </div>
             <div class="card further-maths">
                 <h2>Further Maths Worksheets</h2>
                 <ul id="further-maths-worksheets">
                     <li>Loading...</li>
                 </ul>
             </div>
             <div class="card gcse">
                 <h2>GCSE Answers</h2>
                 <ul id="gcse-answers">
                     <li>Loading...</li>
                 </ul>
             </div>
             <div class="card further-maths">
                 <h2>Further Maths Answers</h2>
                 <ul id="further-maths-answers">
                     <li>Loading...</li>
                 </ul>
             </div>
         </div>
         <div id="squares-container"></div>
     </div>
 
     <div class="loader-wrapper">
         <div class="loader-container">
             <div class="line"></div>
             <div class="line"></div>
             <div class="line"></div>
             <div class="line"></div>
             <div class="line"></div>
             <div class="line"></div>
         </div>
         <p id="progress-text" class="progress-text">Loading... 0%</p>
         <p id="current-task" class="current-task">Initialising...</p>
     </div>
 
     <style>
         .loader-wrapper {
             display: flex;
             flex-direction: column;
             align-items: center;
             justify-content: center;
             height: 100vh;
             font-family: Arial, sans-serif;
         }
 
         .loader-container {
             --uib-size: 50px;
             --uib-color: #3498db;
             --uib-speed: 0.9s;
             --uib-stroke: 4px;
             position: relative;
             display: flex;
             align-items: center;
             justify-content: center;
             height: var(--uib-size);
             width: var(--uib-size);
         }
 
         .line {
             position: absolute;
             top: calc(50% - var(--uib-stroke) / 2);
             left: 0;
             height: var(--uib-stroke);
             width: 100%;
             border-radius: calc(var(--uib-stroke) / 2);
             background-color: var(--uib-color);
             animation: rotate var(--uib-speed) ease-in-out infinite alternate;
             transition: background-color 0.3s ease;
         }
 
         .line:nth-child(1) {
             animation-delay: calc(var(--uib-speed) * -0.375);
         }
 
         .line:nth-child(2) {
             animation-delay: calc(var(--uib-speed) * -0.375);
             opacity: 0.8;
         }
 
         .line:nth-child(3) {
             animation-delay: calc(var(--uib-speed) * -0.3);
             opacity: 0.6;
         }
 
         .line:nth-child(4) {
             animation-delay: calc(var(--uib-speed) * -0.225);
             opacity: 0.4;
         }
 
         .line:nth-child(5) {
             animation-delay: calc(var(--uib-speed) * -0.15);
             opacity: 0.2;
         }
 
         .line:nth-child(6) {
             animation-delay: calc(var(--uib-speed) * -0.075);
             opacity: 0.1;
         }
 
         @keyframes rotate {
             0% {
                 transform: rotate(0deg);
             }
             100% {
                 transform: rotate(180deg);
             }
         }
 
         .progress-text {
             margin-top: 20px;
             font-size: 18px;
         }
 
         .current-task {
             margin-top: 5px;
             font-size: 14px;
             font-style: italic;
         }
 
         .progress-text, .current-task {
             color: white;
             text-shadow: 0 0 10px rgba(255, 255, 255, 0.3), 
                         0 0 20px rgba(255, 255, 255, 0.3),
                         0 0 30px rgba(255, 255, 255, 0.1);
             font-weight: bold;
             text-align: center;
         }
     </style>
 
     <script>
         document.addEventListener('DOMContentLoaded', () => {
             const loader = document.querySelector('.loader-wrapper');
             const progressText = document.getElementById('progress-text');
             const currentTaskText = document.getElementById('current-task');
             const content = document.getElementById('content');
             let progress = 0;
 
             const tasks = [
                 "Connecting to Corbett Maths...",
                 "Fetching URLs...",
                 "Parsing GCSE Worksheets...",
                 "Finding answers link for GCSE...",
                 "Fetching answers for GCSE...",
                 "Parsing Further Maths Worksheets...",
                 "Fetching Answers index...",
                 "Found answers page URL, fetching answers...",
                 "Loading Webpage..."
             ];
 
             function updateTask(index) {
                 if (index < tasks.length) {
                     currentTaskText.textContent = tasks[index];
                 } else {
                     currentTaskText.textContent = "Finishing up...";
                 }
             }
 
             const interval = setInterval(() => {
                 progress += Math.floor(Math.random() * 10) + 5;
                 progress = Math.min(progress, 100);
                 progressText.textContent = `Loading... ${progress}%`;
 
                 const taskIndex = Math.floor((progress / 100) * tasks.length);
                 updateTask(taskIndex);
 
                 if (progress === 100) {
                     clearInterval(interval);
                     loader.style.display = 'none';
                     content.style.display = 'block';
 
                     // Fetch data from the server
                     fetch('/fetch_data')
                         .then(response => response.json())
                         .then(data => {
                             document.getElementById('gcse-worksheets').innerHTML = data.gcse_links.map(link => `<li><a href="${link[1]}" target="_blank">${link[0]}</a></li>`).join('');
                             document.getElementById('further-maths-worksheets').innerHTML = data.further_maths_links.map(link => `<li><a href="${link[1]}" target="_blank">${link[0]}</a></li>`).join('');
                             document.getElementById('gcse-answers').innerHTML = data.gcse_answers.map(link => `<li><a href="${link[1]}" target="_blank">${link[0]}</a></li>`).join('');
                             document.getElementById('further-maths-answers').innerHTML = data.further_maths_answers.map(link => `<li><a href="${link[1]}" target="_blank">${link[0]}</a></li>`).join('');
                         })
                         .catch(error => {
                             console.error('Error fetching data:', error);
                             document.getElementById('gcse-worksheets').innerHTML = '<li>Error loading data</li>';
                             document.getElementById('further-maths-worksheets').innerHTML = '<li>Error loading data</li>';
                             document.getElementById('gcse-answers').innerHTML = '<li>Error loading data</li>';
                             document.getElementById('further-maths-answers').innerHTML = '<li>Error loading data</li>';
                         });
 
                     // Dynamically load the script
                     const script = document.createElement('script');
                     script.src = "{{ url_for('static', filename='scripts.js') }}";
                     script.type = "text/javascript";
 
                     script.onload = () => {
                         console.log('scripts.js loaded');
                         initialiseAnimations();
                     };
 
                     document.body.appendChild(script);
                 }
             }, 500); // Update progress every 500ms
         });
 
         function initialiseAnimations() {
             const animationLeft = bodymovin.loadAnimation({
                 container: document.getElementById('lottie-background-left'),
                 renderer: 'svg',
                 loop: true,
                 autoplay: true,
                 path: 'https://uploads-ssl.webflow.com/63c6b6a8e34f347803dc4c5a/63c72e591d68c14a86db2727_night-sky.json',
                 rendererSettings: {
                     preserveAspectRatio: 'xMidYMid slice'
                 }
             });
 
             const animationRight = bodymovin.loadAnimation({
                 container: document.getElementById('lottie-background-right'),
                 renderer: 'svg',
                 loop: true,
                 autoplay: true,
                 path: 'https://uploads-ssl.webflow.com/63c6b6a8e34f347803dc4c5a/63c72e591d68c14a86db2727_night-sky.json',
                 rendererSettings: {
                     preserveAspectRatio: 'xMidYMid slice'
                 }
             });
 
             animationLeft.setSpeed(0.5);
             animationRight.setSpeed(0.5);
 
             initialiseSymbols();
         }
 
         function initialiseSymbols() {
             const numSymbol = 25;
             const symbolArray = [];
             const svg = document.getElementById('symbol-container');
 
             let mouseX = window.innerWidth / 2;
             let mouseY = window.innerHeight / 2;
 
             document.addEventListener('mousemove', (event) => {
                 mouseX = event.clientX;
                 mouseY = event.clientY;
             });
 
             const symbols = ['×', '+', '-', '÷'];
 
             for (let i = 0; i < numSymbol; i++) {
                 const symbol = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                 symbol.setAttribute('fill', 'lightblue');
                 symbol.setAttribute('font-size', '20');
                 symbol.setAttribute('text-anchor', 'middle');
                 symbol.setAttribute('dominant-baseline', 'middle');
                 symbol.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                 symbol.style.filter = 'drop-shadow(0 0 10px rgba(0, 255, 255, 0.8))';
                 svg.appendChild(symbol);
 
                 symbolArray.push({
                     element: symbol,
                     x: Math.random() * window.innerWidth,
                     y: Math.random() * window.innerHeight,
                     speedX: Math.random() * 2 + 0.5,
                     speedY: Math.random() * 2 + 0.5,
                     sway: Math.random() * 0.02 - 0.01,
                     direction: Math.random() * Math.PI * 2,
                 });
             }
 
             function animateSymbol() {
                 symbolArray.forEach(symbol => {
                     symbol.x += symbol.speedX * Math.cos(symbol.direction);
                     symbol.y += symbol.speedY * Math.sin(symbol.direction);
                     symbol.x += Math.sin(symbol.direction) * symbol.sway * 30;
                     symbol.y += Math.cos(symbol.direction) * symbol.sway * 20;
                     symbol.direction += symbol.sway;
 
                     if (symbol.x > window.innerWidth || symbol.x < 0) {
                         symbol.speedX = -symbol.speedX;
                     }
                     if (symbol.y > window.innerHeight || symbol.y < 0) {
                         symbol.speedY = -symbol.speedY;
                     }
 
                     symbol.x += (mouseX - symbol.x) * 0.01;
                     symbol.y += (mouseY - symbol.y) * 0.01;
 
                     symbol.element.setAttribute('x', symbol.x);
                     symbol.element.setAttribute('y', symbol.y);
                 });
                 requestAnimationFrame(animateSymbol);
             }
 
             animateSymbol();
         }
     </script>
 </body>
 </html>
