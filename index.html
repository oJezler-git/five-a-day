    <script>

    <script>
        function initialiseContent() {
            createStarryBackground();
            
            let e=new Date,
                t=`${String(e.getDate()).padStart(2,"0")}-${String(e.getMonth()+1).padStart(2,"0")}`,
                n=e.toLocaleDateString("en-GB",{year:"numeric",month:"numeric",day:"numeric"});
            
            // date selector
            let dateContainer = document.getElementById("current-date");
            dateContainer.innerHTML = `
                <span>For today's date: ${n}</span>
                <button id="change-date-btn" class="highlight-button" data-text="Change Date">
                    <span class="actual-text">&nbsp;Change&nbsp;Date&nbsp;</span>
                    <span aria-hidden="true" class="hover-text">&nbsp;Change&nbsp;Date&nbsp;</span>
                </button>
                <div id="date-picker-container" class="date-picker-container">
                    <button class="close-btn">&times;</button>
                    <input type="date" id="date-picker" class="date-picker">
                    <button id="apply-date-btn" class="apply-date-btn">Apply</button>
                </div>
            `;
            
            // confirmation dialog
            let confirmationDialog = document.createElement('div');
            confirmationDialog.className = 'confirmation-dialog';
            confirmationDialog.innerHTML = `
                <button class="close-btn">&times;</button>
                <p>Reset to today's date?</p>
                <div class="confirmation-buttons">
                    <button class="confirm-btn">Yes</button>
                    <button class="cancel-btn">No</button>
                </div>
            `;
            document.body.appendChild(confirmationDialog);
            
            const changeDateBtn = document.getElementById("change-date-btn");
            
            changeDateBtn.addEventListener("click", function() {
                // If in reset mode, show confirmation dialog
                if (this.classList.contains('reset-mode')) {
                    // Simply show the dialog (it will be centered by CSS)
                    confirmationDialog.classList.add("visible");
                } else {
                    // Otherwise toggle date picker
                    document.getElementById("date-picker-container").classList.toggle("active");
                }
            });
            
            document.getElementById("apply-date-btn").addEventListener("click", function() {
                let selectedDate = document.getElementById("date-picker").value;
                if (selectedDate) {
                    let dateParts = selectedDate.split("-");
                    let formattedDate = `${dateParts[2]}-${dateParts[1]}`;
                    let displayDate = new Date(selectedDate).toLocaleDateString("en-GB", {
                        year: "numeric", month: "numeric", day: "numeric"
                    });
                    
                    document.querySelector("#current-date span").textContent = `Selected date: ${displayDate}`;
                    document.getElementById("date-picker-container").classList.remove("active");
                    
                    // Change button to Reset mode
                    changeDateBtn.classList.add("reset-mode");
                    changeDateBtn.setAttribute("data-text", "Reset");
                    changeDateBtn.querySelector(".actual-text").innerHTML = "&nbsp;Reset&nbsp;";
                    changeDateBtn.querySelector(".hover-text").innerHTML = "&nbsp;Reset&nbsp;";
                    
                    // Update content for selected date
                    updateContentForDate(formattedDate);
                }
            });
            
            // Add event listeners for confirmation dialog
            document.querySelector(".confirm-btn").addEventListener("click", function() {
                // Reset to today's date
                let today = new Date();
                let todayFormatted = `${String(today.getDate()).padStart(2,"0")}-${String(today.getMonth()+1).padStart(2,"0")}`;
                let todayDisplay = today.toLocaleDateString("en-GB", {
                    year: "numeric", month: "numeric", day: "numeric"
                });
                
                document.querySelector("#current-date span").textContent = `For today's date: ${todayDisplay}`;
                
                // Change button back to Change Date mode
                changeDateBtn.classList.remove("reset-mode");
                changeDateBtn.setAttribute("data-text", "Change Date");
                changeDateBtn.querySelector(".actual-text").innerHTML = "&nbsp;Change&nbsp;Date&nbsp;";
                changeDateBtn.querySelector(".hover-text").innerHTML = "&nbsp;Change&nbsp;Date&nbsp;";
                
                confirmationDialog.classList.remove("visible");
                
                updateContentForDate(todayFormatted);
            });
            
            document.querySelector(".cancel-btn").addEventListener("click", function() {
                confirmationDialog.classList.remove("visible");
            });

            document.querySelectorAll('.close-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const parent = this.closest('.date-picker-container, .confirmation-dialog');
                    if (parent.classList.contains('date-picker-container')) {
                        parent.classList.remove('active');
                    } else {
                        parent.classList.remove('visible');
                    }
                });
            });
            
            // click outside to dismiss
            document.addEventListener('click', function(event) {
                // For date picker
                const datePicker = document.getElementById('date-picker-container');
                const changeDateBtn = document.getElementById('change-date-btn');
                
                if (datePicker.classList.contains('active') && 
                    !datePicker.contains(event.target) && 
                    event.target !== changeDateBtn && 
                    !changeDateBtn.contains(event.target)) {
                    datePicker.classList.remove('active');
                }
                
                // For confirmation dialog
                const confirmDialog = document.querySelector('.confirmation-dialog');
                if (confirmDialog.classList.contains('visible') && 
                    !confirmDialog.contains(event.target) && 
                    event.target !== changeDateBtn && 
                    !changeDateBtn.contains(event.target)) {
                    confirmDialog.classList.remove('visible');
                }
            });
            
            // Function to update content for a specific date
            function updateContentForDate(dateKey) {
                let r = worksheetData[dateKey] || {GCSE:{worksheets:[],answers:[]},"Further Maths":{worksheets:[],answers:[]}};
                
                // Add content-changed class to all cards to trigger animation
                document.querySelectorAll('.card').forEach(card => {
                    card.classList.add('content-changed');
                    
                    // Remove the class after animation completes
                    setTimeout(() => {
                        card.classList.remove('content-changed');
                    }, 1200);
                });
                
                s("gcse-worksheets",r.GCSE.worksheets,"No GCSE worksheets found for this date");
                s("further-maths-worksheets",r["Further Maths"].worksheets,"No Further Maths worksheets found for this date");
                s("gcse-answers",r.GCSE.answers,"No GCSE answers found for this date");
                s("further-maths-answers",r["Further Maths"].answers,"No Further Maths answers found for this date");
            }
            
            let r=worksheetData[t]||{GCSE:{worksheets:[],answers:[]},"Further Maths":{worksheets:[],answers:[]}};
            
            function s(e,t,n){let o=document.getElementById(e);if(o.innerHTML="",0===t.length){if(e === "further-maths-answers" && r["Further Maths"].worksheets.length > 0) {
                let s=document.createElement("li");
                s.className="error-message",
                s.textContent="Corbett Maths did not provide answers for this worksheet",
                o.appendChild(s)
            } else if(e !== "further-maths-answers") {
                let s=document.createElement("li");
                s.className="error-message",
                s.textContent=n,
                o.appendChild(s)
            }
        }else t.forEach(([e,t])=>{let n=document.createElement("li"),s=document.createElement("a");s.href=t,s.textContent=e,s.target="_blank",n.appendChild(s),o.appendChild(n)})}
        
        s("gcse-worksheets",r.GCSE.worksheets,"No GCSE worksheets found for today");
        s("further-maths-worksheets",r["Further Maths"].worksheets,"No Further Maths worksheets found for today");
        s("gcse-answers",r.GCSE.answers,"No GCSE answers found (this is HIGHLY likely an error)");
        s("further-maths-answers",r["Further Maths"].answers,"No Further Maths answers found (this is HIGHLY likely an error)");
        
        initialiseSymbols();
    }

    function initialiseSymbols(){
        let e=[],t=document.getElementById("symbol-container"),n=window.innerWidth/2,r=window.innerHeight/2;
        document.addEventListener("mousemove",e=>{n=e.clientX,r=e.clientY});
        let s=["\xd7","+","-","\xf7"];
        for(let o=0;o<25;o++){
            let a=document.createElementNS("http://www.w3.org/2000/svg","text");
            a.setAttribute("fill","lightblue"),a.setAttribute("font-size","20"),a.setAttribute("text-anchor","middle"),a.setAttribute("dominant-baseline","middle"),a.textContent=s[Math.floor(Math.random()*s.length)],a.style.filter="drop-shadow(0 0 10px rgba(0, 255, 255, 0.8))",t.appendChild(a),e.push({element:a,x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,speedX:2*Math.random()+.5,speedY:2*Math.random()+.5,sway:.02*Math.random()-.01,direction:Math.random()*Math.PI*2})
        }
        !function t(){e.forEach(e=>{e.x+=e.speedX*Math.cos(e.direction),e.y+=e.speedY*Math.sin(e.direction),e.x+=Math.sin(e.direction)*e.sway*30,e.y+=Math.cos(e.direction)*e.sway*20,e.direction+=e.sway,(e.x>window.innerWidth||e.x<0)&&(e.speedX=-e.speedX),(e.y>window.innerHeight||e.y<0)&&(e.speedY=-e.speedY),e.x+=(n-e.x)*.01,e.y+=(r-e.y)*.01,e.element.setAttribute("x",e.x),e.element.setAttribute("y",e.y)}),requestAnimationFrame(t)}()
    }


    // loader
    document.addEventListener("DOMContentLoaded",()=>{
        if("true"===localStorage.getItem("ca67d"))
            document.querySelector(".loader-wrapper").style.display="none",initialiseContent();
        else{
            let e=document.querySelector(".loader-wrapper"),t=document.getElementById("progress-text"),n=document.getElementById("current-task"),r=0,s=["Connecting to Corbett Maths...","Fetching URLs...","Parsing GCSE Worksheets...","Finding answers link for GCSE...","Fetching answers for GCSE...","Parsing Further Maths Worksheets...","Fetching Answers index...","Found answers page URL, fetching answers...","Caching..."];
            function o(e){e<s.length?n.textContent=s[e]:n.textContent="Finishing up..."}
            let a=setInterval(()=>{r+=Math.floor(10*Math.random())+5,r=Math.min(r,100),t.textContent=`Loading... ${r}%`;
            let n=Math.floor(r/100*s.length);o(n),100===r&&(clearInterval(a),e.style.display="none",localStorage.setItem("ca67d","true"),initialiseContent())},500)
        }
    });
    </script>
